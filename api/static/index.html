<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Book Spirit - Evidence-first RAG</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #18303a;
        --muted: #627079;
        --paper: #f6f3eb;
        --panel: rgba(255, 255, 255, 0.82);
        --teal: #087f83;
        --teal-dark: #065e61;
        --gold: #dfa621;
        --line: #d7dedc;
        --danger: #a33d32;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        background:
          radial-gradient(circle at 85% 10%, rgba(223, 166, 33, 0.16), transparent 28rem),
          linear-gradient(145deg, #f8f6ef, #edf4f2);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        max-width: 1180px;
        margin: 0 auto;
        padding: 42px 28px 24px;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
        gap: 24px;
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--teal);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        font-size: clamp(2.5rem, 7vw, 5.2rem);
        line-height: 0.95;
        letter-spacing: -0.04em;
      }

      .subtitle {
        max-width: 34rem;
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.55;
      }

      .api-links { white-space: nowrap; }
      .api-links a { color: var(--teal-dark); font-weight: 700; text-decoration: none; }
      .api-links a + a::before { content: " / "; color: var(--muted); }

      main {
        max-width: 1180px;
        margin: 0 auto;
        padding: 10px 28px 60px;
        display: grid;
        grid-template-columns: minmax(280px, 0.82fr) minmax(360px, 1.18fr);
        gap: 24px;
      }

      .panel {
        border: 1px solid var(--line);
        border-radius: 22px;
        background: var(--panel);
        box-shadow: 0 24px 70px rgba(25, 48, 58, 0.08);
        backdrop-filter: blur(12px);
      }

      form { padding: 28px; }

      label {
        display: block;
        margin: 0 0 8px;
        font-size: 0.82rem;
        font-weight: 800;
        letter-spacing: 0.04em;
      }

      textarea, input, select {
        width: 100%;
        border: 1px solid #cbd6d3;
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.9);
        color: var(--ink);
        font: inherit;
        outline: none;
      }

      textarea:focus, input:focus, select:focus {
        border-color: var(--teal);
        box-shadow: 0 0 0 3px rgba(8, 127, 131, 0.12);
      }

      textarea { min-height: 132px; padding: 14px; resize: vertical; line-height: 1.5; }
      input, select { height: 46px; padding: 0 12px; }

      .field { margin-bottom: 18px; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

      button {
        width: 100%;
        min-height: 50px;
        border: 0;
        border-radius: 14px;
        color: white;
        background: var(--teal);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        transition: transform 140ms ease, background 140ms ease;
      }

      button:hover { background: var(--teal-dark); transform: translateY(-1px); }
      button:disabled { cursor: wait; opacity: 0.66; transform: none; }

      .hint { margin: 13px 0 0; color: var(--muted); font-size: 0.82rem; line-height: 1.45; }

      .result-panel { min-height: 540px; padding: 28px; }
      .result-header { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
      .result-header h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-size: 1.8rem; }

      .status {
        margin: 0;
        padding: 7px 11px;
        border-radius: 999px;
        color: var(--teal-dark);
        background: rgba(8, 127, 131, 0.1);
        font-size: 0.78rem;
        font-weight: 800;
      }

      .status.error { color: var(--danger); background: rgba(163, 61, 50, 0.1); }
      .answer { margin: 24px 0; padding: 18px 20px; border-left: 4px solid var(--gold); background: #fffdf7; line-height: 1.75; white-space: pre-wrap; }
      .answer:empty { display: none; }

      .sources { display: grid; gap: 12px; }
      .source {
        padding: 16px 18px;
        border: 1px solid var(--line);
        border-radius: 14px;
        background: rgba(255, 255, 255, 0.72);
      }

      .source-meta { display: flex; justify-content: space-between; gap: 10px; color: var(--teal-dark); font-size: 0.78rem; font-weight: 800; }
      .source p { margin: 9px 0 0; color: #364b54; line-height: 1.55; }
      .empty { margin: 90px auto; max-width: 24rem; color: var(--muted); text-align: center; line-height: 1.7; }

      @media (max-width: 820px) {
        header { align-items: flex-start; flex-direction: column; }
        main { grid-template-columns: 1fr; }
        .api-links { white-space: normal; }
      }

      @media (max-width: 520px) {
        header, main { padding-left: 18px; padding-right: 18px; }
        .grid { grid-template-columns: 1fr; }
        .result-header { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <p class="eyebrow">Evidence-first RAG demo</p>
        <h1>Book Spirit</h1>
        <p class="subtitle">用《納瓦爾寶典》展示可重複的檢索、來源證據與 API 分層測試。</p>
      </div>
      <nav class="api-links" aria-label="API links">
        <a href="/docs">Swagger</a><a href="/health">Health</a>
      </nav>
    </header>

    <main>
      <form id="rag-form" class="panel" data-testid="rag-form">
        <div class="field">
          <label for="question">問題</label>
          <textarea id="question" data-testid="question-input" required>什麼是專長？</textarea>
        </div>

        <div class="grid">
          <div class="field">
            <label for="mode">執行層級</label>
            <select id="mode" data-testid="mode-select">
              <option value="search">只做檢索（穩定回歸）</option>
              <option value="ask">檢索 + 生成回答</option>
            </select>
          </div>
          <div class="field">
            <label for="book-id">Book ID</label>
            <input id="book-id" data-testid="book-id-input" value="naval-almanac" />
          </div>
        </div>

        <div class="grid">
          <div class="field">
            <label for="strategy">Retrieval strategy</label>
            <select id="strategy" data-testid="strategy-select">
              <option value="vector">vector</option>
              <option value="hybrid">hybrid</option>
              <option value="hybrid_rerank">hybrid + rerank</option>
            </select>
          </div>
          <div class="field">
            <label for="top-k">Top K</label>
            <select id="top-k" data-testid="top-k-select">
              <option value="3">3</option>
              <option value="5">5</option>
            </select>
          </div>
        </div>

        <button type="submit" data-testid="submit-button">搜尋證據</button>
        <p class="hint">Selenium smoke 固定走 `/search`；LLM 問答保留給人工 demo，降低 flaky 與執行時間。</p>
      </form>

      <section class="panel result-panel" aria-live="polite">
        <div class="result-header">
          <h2>Evidence</h2>
          <p id="status" class="status" data-testid="status">等待問題</p>
        </div>
        <div id="answer" class="answer" data-testid="answer"></div>
        <div id="sources" class="sources" data-testid="sources">
          <p class="empty">送出問題後，這裡會顯示檢索片段、章節、頁碼、分數與執行時間。</p>
        </div>
      </section>
    </main>

    <script>
      const form = document.querySelector("#rag-form");
      const mode = document.querySelector("#mode");
      const submit = document.querySelector("[data-testid='submit-button']");
      const status = document.querySelector("#status");
      const answer = document.querySelector("#answer");
      const sources = document.querySelector("#sources");

      mode.addEventListener("change", () => {
        submit.textContent = mode.value === "ask" ? "產生回答" : "搜尋證據";
      });

      function renderSources(items) {
        sources.replaceChildren();
        if (!items.length) {
          const empty = document.createElement("p");
          empty.className = "empty";
          empty.textContent = "沒有找到相關證據。";
          sources.append(empty);
          return;
        }

        items.forEach((item, index) => {
          const card = document.createElement("article");
          card.className = "source";
          card.dataset.testid = "source-card";

          const meta = document.createElement("div");
          meta.className = "source-meta";
          const location = document.createElement("span");
          location.textContent = `${index + 1}. ${item.chapter || item.title || "來源"}`;
          const score = document.createElement("span");
          score.textContent = `score ${(item.score ?? 0).toFixed(3)}`;
          meta.append(location, score);

          const text = document.createElement("p");
          text.textContent = item.text_preview || "";
          card.append(meta, text);
          sources.append(card);
        });
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const endpoint = mode.value === "ask" ? "/ask" : "/search";
        const payload = {
          question: document.querySelector("#question").value.trim(),
          backend: "native",
          book_id: document.querySelector("#book-id").value.trim() || null,
          top_k: Number(document.querySelector("#top-k").value),
          retrieval_strategy: document.querySelector("#strategy").value,
        };
        if (mode.value === "ask") payload.temperature = 0;

        submit.disabled = true;
        status.className = "status";
        status.textContent = "執行中";
        answer.textContent = "";

        try {
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          const data = await response.json();
          if (!response.ok) throw new Error(data.detail || `HTTP ${response.status}`);

          const elapsed = Number(data.stage_timings?.total_seconds ?? data.time_elapsed ?? 0);
          status.textContent = `${data.sources.length} sources · ${elapsed.toFixed(2)}s`;
          answer.textContent = mode.value === "ask"
            ? data.answer
            : `找到 ${data.sources.length} 個證據片段；以下結果可直接作為 deterministic regression oracle。`;
          renderSources(data.sources || []);
        } catch (error) {
          status.className = "status error";
          status.textContent = "執行失敗";
          answer.textContent = error.message;
          sources.replaceChildren();
        } finally {
          submit.disabled = false;
        }
      });
    </script>
  </body>
</html>
