[project]
name = "book-spirit"
version = "0.1.0"
description = "Personal RAG learning toy: PDF ingest, Qdrant retrieval, Ollama Q&A, SQLite reading notes"
requires-python = ">=3.10,<3.13"
dependencies = [
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.0",
    "sentence-transformers==3.0.1",
    "torch>=2.0.0",
    "qdrant-client==1.13.0",
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "pydantic>=2.5.0",
    "requests>=2.32.3,<3",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.1",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
test = [
    "pytest>=8.0.0",
    "httpx>=0.25.0,<0.28",
    "ruff>=0.6.0",
    "fastapi>=0.104.1",
    "pydantic>=2.5.0",
    "requests>=2.31.0",
    "psycopg2-binary>=2.9.9",
    "uvicorn>=0.24.0",
]
langchain = [
    "langchain==0.3.0",
    "langchain-community>=0.0.10",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.40",
]
mineru = [
    "mineru[pipeline]>=2.1.9,<3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"api/app.py" = ["E402"]
