name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install test dependencies
        run: uv sync --only-group test --no-default-groups --frozen

      - name: Ruff lint
        run: uv run ruff check core ingest memory eval api integrations scripts tests/

      - name: Pytest
        env:
          RAG_SKIP_INIT: "1"
        run: uv run pytest -q
