name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Ruff lint
        run: ruff check rag_config.py rag_native.py rag_graph.py langchain_retriever.py query_log.py 6_fastapi_server.py tests/

      - name: Pytest
        env:
          RAG_SKIP_INIT: "1"
        run: pytest -q
